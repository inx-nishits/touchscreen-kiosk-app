<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Kiosk Experience</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="state-idle">
    <!-- Overlay for Transitions -->
    <div id="global-transition-overlay" class="transition-overlay"></div>

    <!-- IDLE MODE: Attract Video -->
    <section id="screen-idle" class="screen active">
        <div class="video-container">
            <video id="attract-video" autoplay loop muted playsinline class="fill-screen">
                <source src="assets/videos/attract.mp4" type="video/mp4">
            </video>
            <div class="video-overlay dark-gradient"></div>
        </div>

        <div class="idle-content">
            <h1 class="logo-text">BULGARIAN <span>HERITAGE</span></h1>
            <div class="touch-callout">
                <div class="touch-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                    </svg>
                </div>
                <div class="pulse-text">Touch to Explore</div>
            </div>
        </div>
    </section>

    <!-- INTRO ANIMATION SCREEN -->
    <section id="screen-intro" class="screen">
        <div class="intro-graphics">
            <canvas class="particle-canvas" id="intro-particles"></canvas>
            <div class="intro-logo">
                <h2 class="reveal-text">BULGARIAN HERITAGE</h2>
            </div>
        </div>
    </section>

    <!-- INTERACTIVE MAP SCREEN -->
    <section id="screen-map" class="screen">
        <div class="map-container" id="interactive-map">
            <img src="assets/images/map-base.png" alt="Venue Map" class="map-base">
            
            <!-- POI Hotspots -->
            <div class="hotspots-layer">
                <button class="hotspot odd icon-hall" data-poi="1" style="top: 25%; left: 45%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Sofia Cathedral</span>
                </button>
                <button class="hotspot even icon-tech bottom-area" data-poi="2" style="top: 82%; left: 82%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Rila Monastery</span>
                </button>
                <button class="hotspot odd icon-lounge" data-poi="3" style="top: 12%; left: 78%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Ancient Gold</span>
                </button>
                <button class="hotspot even icon-vip" data-poi="4" style="top: 45%; left: 12%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Plovdiv Theater</span>
                </button>
                <button class="hotspot odd icon-atelier bottom-area" data-poi="5" style="top: 75%; left: 55%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Rose Valley</span>
                </button>
                <button class="hotspot even icon-media" data-poi="6" style="top: 45%; left: 86%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Veliko Tarnovo</span>
                </button>
                <button class="hotspot odd icon-cafe bottom-area" data-poi="7" style="top: 82%; left: 18%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Nessebar Coast</span>
                </button>
                <button class="hotspot even icon-nexus" data-poi="8" style="top: 12%; left: 18%;">
                    <div class="hotspot-inner"></div>
                    <span class="hotspot-label">Seven Lakes</span>
                </button>
            </div>
        </div>
    </section>

    <!-- FULLSCREEN VIDEO PLAYER -->
    <section id="screen-video" class="screen">
        <div class="video-player-container">
            <video id="poi-video-player" playsinline class="fill-screen">
                <source src="" type="video/mp4">
            </video>
            
            <!-- Video Controls -->
            <div class="video-nav">
                <button id="btn-video-home" class="nav-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>HOME</span>
                </button>
                <button id="btn-video-back" class="nav-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                    <span>MAP</span>
                </button>
            </div>

            <div class="video-footer">
                <div class="video-progress-bar">
                    <div id="video-progress" class="progress-fill"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- SESSION ENDED OVERLAY -->

    <!-- SESSION ENDED OVERLAY -->
    <div id="session-ended" class="modal-overlay">
        <div class="modal-content">
            <h3>SESSION ENDED</h3>
            <p>Returning to start for the next visitor...</p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/utils/asset-loader.js"></script>
    <script src="js/modules/intro.js"></script>
    <script src="js/modules/state.js"></script>
    <script src="js/modules/video.js"></script>
    <script src="js/modules/timer.js"></script>
    <script src="js/modules/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
